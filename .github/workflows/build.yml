name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1.1
          target: esp32p4
          command: >-
            idf.py build &&
            idf.py merge-bin -o leon-1p-can-full.bin

      - name: Collect binaries
        run: |
          mkdir -p out
          cp build/leon-dash.bin out/leon-1p-can-app.bin
          cp build/leon-1p-can-full.bin out/
          cd out && sha256sum *.bin > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: leon-1p-can-firmware
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
